name: release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  wheels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install build && python -m build --wheel --outdir dist
        working-directory: tools/sigtool
      - run: gh release upload "$TAG_NAME" dist/*.whl --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.release.tag_name }}
