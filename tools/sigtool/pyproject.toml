[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "game-re-sigtool"
version = "0.2.1"
description = "Offline CLI to scan, generate and regression-check AOB signatures and walk pointer chains"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "juzorei" }]
keywords = ["reverse-engineering", "signature", "aob", "pattern-scan", "game-modding", "pe"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Disassemblers",
]

[project.urls]
Homepage = "https://github.com/juzorei/game-re-skills"

[project.scripts]
sigtool = "sigtool.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
